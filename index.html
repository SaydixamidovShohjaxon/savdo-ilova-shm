<!doctype html>
<html lang="uz">
<head>
<script>window.STATIC_MODE=1</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Savdo AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#EEF1EC;--card:#FFFFFF;--ink:#1F2D38;--ink-2:#57646F;--ink-3:#8A96A0;--rule:#DCE1D9;--track:rgba(31,45,56,.07);
  --green:#1E8E5A;--green-bg:#E3F3EC;--red:#C6362A;--red-bg:#FBE8E5;--amber:#B7791F;--amber-bg:rgba(183,121,31,.13);
  --accent:#2a78d6;--accent-ink:#fff;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#141B20;--card:#1D262D;--ink:#E6ECEF;--ink-2:#A6B2BA;--ink-3:#77838C;--rule:#2C3740;--track:rgba(230,236,239,.08);
  --green:#3DBE82;--green-bg:rgba(61,190,130,.14);--red:#EF6B5E;--red-bg:rgba(239,107,94,.14);--amber:#E0AA3E;
  --amber-bg:rgba(224,170,62,.14);--accent:#3987e5;--accent-ink:#fff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--ink-3)}
.back{font:inherit;font-size:14px;font-weight:700;border:0;background:none;color:var(--accent);padding:6px 0;cursor:pointer}
.back[hidden],.bar[hidden]{display:none}
.more{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--accent);padding:4px 2px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.chips{display:inline-flex;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:3px}
.chips button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--ink-2);padding:6px 10px;border-radius:7px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:7px 10px;flex:1;min-width:140px}
select.on{border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin:0 0 10px}
h2{font-size:15px;font-weight:750;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px}
.kpi .l{font-size:12px;font-weight:650;color:var(--ink-2)}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:12px;font-weight:650;color:var(--ink-2);margin-left:3px}
.kpi .d{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}.mute{color:var(--ink-3)}
.depts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 10px}
@media (min-width:560px){.depts{grid-template-columns:repeat(3,1fr)}}
.dept{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px;cursor:pointer;min-height:92px}
.dept .ic{font-size:22px;line-height:1}
.dept .nm{font-size:14px;font-weight:750}
.dept .st{font-size:12px;color:var(--ink-2)}
.dept.off{opacity:.55}
.dept .badge{align-self:flex-start;font-size:11px;font-weight:750;border-radius:6px;padding:1px 7px;background:var(--track);color:var(--ink-2)}
.dept .badge.r{background:var(--red-bg);color:var(--red)}.dept .badge.y{background:var(--amber-bg);color:var(--amber)}.dept .badge.g{background:var(--green-bg);color:var(--green)}
.list{list-style:none;margin:0;padding:0}
.al{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:9px 11px;margin:0 0 7px;cursor:pointer}
.al.s3{border-left-color:var(--red)}.al.s2{border-left-color:var(--amber)}.al.s1{border-left-color:var(--green)}
.al b{display:block;font-size:13px;margin-bottom:2px}
.al span{font-size:13.5px;color:var(--ink-2)}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:6px 0;cursor:default}
.bars li.tap{cursor:pointer}
.bars .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bars .val small{font-weight:500;color:var(--ink-3);margin-left:5px}
.bars .tr{grid-column:1/-1;height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--ink);border-radius:4px}
svg{display:block;width:100%;height:auto;overflow:visible}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--rule);text-align:right}
th{font-size:12px;font-weight:650;color:var(--ink-2)}
th.l,td.l{text-align:left}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.g{background:var(--green)}.dot.y{background:var(--amber)}.dot.r{background:var(--red)}
.br{border:1px solid var(--rule);border-radius:12px;padding:11px;margin:0 0 8px;background:var(--card)}
.br .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.br .h b{font-size:15px}
.br .m{font-size:12.5px;color:var(--ink-2);margin:3px 0 4px}
.br .ln{font-size:13px;color:var(--ink-2);margin:3px 0 0}
.br .act{margin-top:8px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 10px;cursor:pointer}
.ev{font-size:13.5px;line-height:1.45;padding:9px 11px;margin:0 0 7px;border-radius:10px;background:var(--red-bg);border-left:4px solid var(--red)}
.ev.y{background:var(--amber-bg);border-left-color:var(--amber)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:4px;margin:0 0 10px}
.tabs button{flex:1;font:inherit;font-size:13.5px;font-weight:700;border:0;background:none;color:var(--ink-2);padding:8px 6px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.note{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
.warn{font-size:13px;background:var(--amber-bg);color:var(--ink);border-radius:10px;padding:9px 11px;margin:0 0 10px}
.fc{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:12px;padding:11px 12px;margin:0 0 10px;font-size:14px}
.fc b{font-variant-numeric:tabular-nums}
details{margin:0 0 8px}
summary{cursor:pointer;font-weight:750;padding:9px 11px;background:var(--card);border:1px solid var(--rule);border-radius:10px;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{border-radius:10px 10px 0 0}
details .in{border:1px solid var(--rule);border-top:0;border-radius:0 0 10px 10px;padding:6px 10px;background:var(--card)}
.chat{display:flex;flex-direction:column;gap:8px;min-height:40vh;margin:0 0 10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:4px}
.ask{display:flex;gap:8px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bg);padding:6px 0}
.ask input{flex:1;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.ask button,.qs button{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;cursor:pointer}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qs button{font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--rule);padding:7px 10px}
.load{padding:50px 10px;text-align:center;color:var(--ink-2)}
.spin{width:28px;height:28px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.empty{padding:20px 6px;color:var(--ink-2);text-align:center}
/* ---- vizual kartochkalar */
:root{--s1:#2a78d6;--grid:#E6E9E4;--axis:#C9CFC6}
:root[data-theme="dark"]{--s1:#3987e5;--grid:#2A343C;--axis:#3A4650}
.vz{position:relative}
.vz .vh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 10px}
.vz .vh h2{margin:0}
.vz .vh .vs{font-size:12px;color:var(--ink-3);margin-top:2px}
.vbtn{flex:none;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--bg);border:1px solid var(--rule);border-radius:9px;padding:5px 8px;cursor:pointer}
.vbtn svg{width:16px;height:16px}
.vmenu{position:absolute;right:12px;top:46px;z-index:5;width:min(280px,calc(100% - 24px));background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px}
.vmenu[hidden]{display:none}
.vmenu .t{font-size:12px;font-weight:700;color:var(--ink-3);margin:0 2px 8px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:11px;font-weight:650;color:var(--ink-2);background:none;border:1px solid transparent;border-radius:10px;padding:8px 2px;cursor:pointer}
.vgrid button svg{width:24px;height:24px;color:var(--s1)}
.vgrid button[aria-pressed="true"]{border-color:var(--s1);background:var(--track);color:var(--ink)}
.plot{min-height:40px;touch-action:pan-y}
.plot svg text{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--card);border-radius:9px;padding:7px 10px;font-size:13px;line-height:1.35;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#tip b{display:block;font-size:15px}
#tip[hidden]{display:none}
.hb{list-style:none;margin:0;padding:0}
.hb li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--grid)}
.hb li:last-child{border-bottom:0}
.hb li.tap{cursor:pointer}
.hb .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .val{font-size:14px;font-weight:700;text-align:right}
.hb .val small{font-weight:500;color:var(--ink-3);margin-left:6px}
.hb .tr{grid-column:1/-1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.lg{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.lg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13.5px}
.lg .sw{width:12px;height:12px;border-radius:3px}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .v{font-weight:700}
.lg .p{color:var(--ink-3);min-width:36px;text-align:right}
.lg li.tap{cursor:pointer}
.vt{width:100%;font-size:13.5px}
.vt td.l{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt tbody tr.tap{cursor:pointer}
.hl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:8px}
.hl i{flex:0 0 90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--track),var(--s1))}
.kpi .spk{display:block;margin-top:6px}
.kpi .d .mute{font-weight:600}
</style>
</head>
<body>
<div id="tip" hidden></div>
<main class="wrap">
  <div class="top">
    <div><button class="back" id="back" hidden>‹ Bo'limlar</button><h1 id="title">Savdo AI</h1><div class="sub" id="sub"></div></div>
  </div>
  <div class="bar" id="bar">
    <div class="chips" role="group" aria-label="Davr">
      <button data-days="1" aria-pressed="true">Kecha</button><button data-days="7" aria-pressed="false">7 kun</button><button data-days="30" aria-pressed="false">30 kun</button>
    </div>
    <select id="branch" aria-label="Filial"></select>
  </div>
  <div id="view"><div class="load"><div class="spin"></div>Ma'lumot yuklanmoqda...</div></div>
</main>

<script>
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const INIT = (TG && TG.initData) || new URLSearchParams(location.hash.slice(1)).get("tgWebAppData") || "";
const S = {days: 1, branch: "", page: "home", sub: null, tab: 0, chat: []};
const $ = id => document.getElementById(id), NB = " ";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const som = v => Math.round(v || 0).toLocaleString("ru-RU").replace(/\s/g, NB);
const mln = v => (v / 1e6).toFixed(1).replace(".", ",") + NB + "mln";
const pc = x => x == null ? "" : `<span class="${x >= 0 ? "up" : "down"}">${x >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(x * 100))}%</span>`;
const lvl = l => l === "🔴" ? "r" : l === "🟡" ? "y" : "g";
let D = null;

if (TG) {
  TG.ready(); TG.expand();
  document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light";
  TG.onEvent("themeChanged", () => document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light");
  TG.BackButton.onClick(() => go("home"));
} else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";

const STATIC = !!window.STATIC_MODE;
let SKEY = null, SVER = null, SAT = "", BUND = {};

const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function sFetch(path) {
  const r = await fetch(path + "?v=" + SVER, {cache: "no-store"});
  if (!r.ok) throw new Error("Ma'lumot fayli topilmadi (" + r.status + "). Bot hali ma'lumot yuklamagan bo'lishi mumkin.");
  return new Uint8Array(await r.arrayBuffer());
}
async function gunzip(u8) {
  if ("DecompressionStream" in window) return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return window.pako.ungzip(u8);   // eski Safari/Telegram: ichki kutubxona
}
async function sDec(buf) {
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: buf.slice(0, 12)}, SKEY, buf.slice(12));

  let s = `<div class="fc">📦 <b>${esc(sp.next)}</b> uchun kerakli miqdor: so'nggi 7 kunlik o'rtacha × shu hafta kunining odatdagi ta'siri.</div>`;
  if (!S.branch) s += `<div class="card"><h2>Tarmoq bo'yicha (top 10)</h2><table><thead><tr><th class="l">Mahsulot</th><th>Kuniga</th><th>Ertaga</th></tr></thead><tbody>${sp.net.map(r => `<tr><td class="l">${esc(r.item)}</td><td>${r.per_day}</td><td><b>${r.tomorrow}</b></td></tr>`).join("")}</tbody></table></div>`;
  s += `<h2 style="margin:6px 2px 8px">Filiallar bo'yicha</h2>` + sp.branches.map(b => `<details${S.branch ? " open" : ""}><summary>${esc(b.branch)} <span class="mute" style="font-weight:500">· ertaga ${b.idx > 1.05 ? "odatdagidan ko'p" : b.idx < .95 ? "odatdagidan kam" : "odatdagidek"} (${b.idx}×)</span></summary><div class="in">
    <table><thead><tr><th class="l">Mahsulot</th><th>Kuniga</th><th>Ertaga</th></tr></thead><tbody>${b.items.map(r => `<tr><td class="l">${esc(r.item)}</td><td>${r.per_day}</td><td><b>${r.tomorrow}</b></td></tr>`).join("")}</tbody></table></div></details>`).join("");
  $("view").innerHTML = s + `<p class="note">Miqdor 1C'dagi birlikda (dona yoki kg). Bayram va aksiyalar hisobga olinmagan.</p>`;
}
function pageFinance() {
  const f = D.finance;
  let s = `<div class="kpis">${kpi("Tushum", mln(f.rev), "so'm")}${kpi("Qaytarishlar", mln(-f.returns), "so'm")}</div>`;
  if (f.no_cost_own > .3) s += `<div class="warn">⚠️ O'z mahsulotimiz tushumining ${Math.round(f.no_cost_own * 100)}% i uchun 1C'da tannarx kiritilmagan — foyda faqat tannarxi bor ${Math.round(f.costed_share * 100)}% qism bo'yicha hisoblandi.</div>`;
  s += `<div class="card"><h2>Kategoriyalar: ulush va marja</h2><table><thead><tr><th class="l">Kategoriya</th><th>Tushum</th><th>Ulush</th><th>Marja</th></tr></thead><tbody>${f.cats.map(c => `<tr><td class="l">${esc(c.cat)}</td><td>${mln(c.rev)}</td><td>${Math.round(c.share * 100)}%</td><td>${c.margin == null ? "—" : `<b>${Math.round(c.margin * 100)}%</b>`}</td></tr>`).join("")}</tbody></table>
    <p class="note">Marja = (tushum − tannarx) / tushum, faqat tannarxi to'g'ri kiritilgan sotuvlar bo'yicha. Tannarx xatolari: ${f.issues} ta.</p></div>`;
  $("view").innerHTML = s;
}
function pageAnalytics() {
  const n = D.analytics.net, T = {trend: "📈 Savdo va prognoz", kpi: "🧾 Mijoz soni va o'rtacha chek", branch: "🏪 Filiallar", cat: "🥩 Kategoriyalar", item: "🔝 Mahsulotlar", log: "🕵️ Kassa"};
  const fc = (n.trend || []).filter(t => t.startsWith("🔮"));
  $("view").innerHTML = (fc.length ? `<div class="fc">${fc.map(t => `<div>${esc(t)}</div>`).join("")}</div>` : "") + Object.keys(T).filter(k => (n[k] || []).length).map(k =>
    `<div class="card"><h2>${T[k]}</h2>${n[k].filter(t => !t.startsWith("🔮")).map(t => `<div class="ln" style="margin:0 0 6px">• ${esc(t)}</div>`).join("")}</div>`).join("")
    + `<p class="note">Prognoz: so'nggi 7 kun o'rtachasi × hafta kuni koeffitsienti. Ma'lumot ko'paygani sari aniqlashadi.</p>`;
}
function pageAI() {
  const qs = ["Kecha qaysi filial eng ko'p sotdi?", "Qaysi filialda kassa muammosi ko'p?", "Ertaga qancha savdo kutilyapti?", "Marinad ulushi qaysi filialda past?"];
  $("view").innerHTML = `<div class="chat" id="chat">${S.chat.map(m => `<div class="msg ${m.me ? "me" : "ai"}">${esc(m.t)}</div>`).join("") || `<div class="msg ai">Salom! Savdo, filiallar, kassa yoki prognoz bo'yicha savol bering — ma'lumotdan aniq raqam bilan javob beraman.</div>`}</div>
    ${S.chat.length ? "" : `<div class="qs">${qs.map(q => `<button>${esc(q)}</button>`).join("")}</div>`}
    <form class="ask" id="ask"><input id="q" placeholder="Savolingiz..." autocomplete="off" maxlength="500"><button>Yuborish</button></form>`;
  document.querySelectorAll(".qs button").forEach(b => b.onclick = () => send(b.textContent));
  $("ask").onsubmit = e => { e.preventDefault(); send($("q").value); };
}
async function send(q) {
  q = (q || "").trim(); if (!q) return;
  S.chat.push({me: 1, t: q}, {t: "⏳ O'ylayapman..."}); pageAI(); window.scrollTo(0, document.body.scrollHeight);
  try { const r = await api("/api/ask", {q}); S.chat[S.chat.length - 1] = {t: r.answer}; }
  catch (e) { S.chat[S.chat.length - 1] = {t: "⚠️ " + e.message}; }
  pageAI(); window.scrollTo(0, document.body.scrollHeight);
}
let DASH = null;   // bir marta yuklangan dashboard (blob manzil)
async function pageDash() {
  const v = $("view");
  const show = () => {
    v.innerHTML = `<iframe id="dash" src="${DASH}" title="Dashboard" scrolling="no" style="display:block;width:100%;height:80vh;border:0;border-radius:12px;background:var(--bg)"></iframe>`;
    const f = $("dash");
    f.onload = () => {   // iframe bo'yi = ichidagi sahifa bo'yi: bitta oddiy aylantirish, telefonni yotqizganda ham
      const d = f.contentDocument; if (!d) return;
      const fit = () => { f.style.height = (d.body.scrollHeight + 4) + "px"; };
      fit(); new ResizeObserver(fit).observe(d.body);
    };
  };
  try { localStorage.setItem("savdoTheme", document.documentElement.dataset.theme === "dark" ? "dark" : "light"); } catch (e) {}
  if (DASH) return show();
  v.innerHTML = `<div class="load"><div class="spin"></div>Dashboard tayyorlanmoqda...<br><small>Birinchi marta 10–60 soniya</small></div>`;
  try {
    if (STATIC) DASH = URL.createObjectURL(new Blob([await sDec(await sFetch("d/dash.bin"))], {type: "text/html"}));
    else {
      const r = await fetch("/api/dashboard", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({initData: INIT})});
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ("Xato " + r.status)); }
      DASH = URL.createObjectURL(await r.blob());
    }
    if (S.page === "dash") show();
  } catch (e) { v.innerHTML = `<div class="card empty">⚠️ ${esc(e.message)}</div>`; }
}
function pagePlanned() {
  const p = D.planned.find(x => x.id === S.page);
  $("view").innerHTML = `<div class="card"><h2>${p.icon} ${esc(p.name)} — rejada</h2><p>${esc(p.note)}</p><p class="note">Ma'lumot manbai ulanganda bu bo'lim avtomatik ishga tushadi.</p></div>`;
}
function render() {
  if (!D) return;
  header();
  if (D.empty) { $("view").innerHTML = `<div class="card empty">Bu tanlov bo'yicha savdo yo'q. Davr yoki filialni o'zgartiring.</div>`; return; }
  if ((D.planned || []).some(p => p.id === S.page)) return pagePlanned();
  ({home: pageHome, sales: pageSales, branches: pageBranches, kassa: pageKassa, supply: pageSupply, finance: pageFinance,
    analytics: pageAnalytics, ai: pageAI, dash: pageDash}[S.page] || pagePlanned)();
}
document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { S.days = +b.dataset.days; load(); });
$("branch").onchange = e => { S.branch = e.target.value; load(); };
$("back").onclick = () => go("home");
prefLoad().then(STATIC ? sBoot : load);
</script>
</body>
